name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Read project versions
      id: versions
      shell: bash
      run: |
        mod_version="$(jq -er '.version' src/PapermakingPapyrus/modinfo.json)"
        game_version="$(jq -er '.dependencies.game' src/PapermakingPapyrus/modinfo.json)"
        echo "mod=${mod_version}" >> "$GITHUB_OUTPUT"
        echo "game=${game_version}" >> "$GITHUB_OUTPUT"
        echo "VINTAGE_STORY=${GITHUB_WORKSPACE}/.cache/vintagestory/${game_version}" >> "$GITHUB_ENV"

    - name: Set up .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: 10.0.x

    - name: Cache Vintage Story server
      id: cache-vs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.VINTAGE_STORY }}
        key: vintage-story-server-${{ runner.os }}-${{ steps.versions.outputs.game }}

    - name: Install Vintage Story build dependencies
      if: steps.cache-vs.outputs.cache-hit != 'true'
      run: scripts/install-vintage-story.sh "${{ steps.versions.outputs.game }}" "$VINTAGE_STORY"

    - name: Restore
      run: dotnet restore PapermakingPapyrus.slnx

    - name: Check version consistency
      shell: bash
      run: |
        project_version="$(dotnet msbuild src/PapermakingPapyrus/PapermakingPapyrus.csproj -getProperty:Version -nologo)"
        if [[ "${project_version}" != "${{ steps.versions.outputs.mod }}" ]]; then
          echo "::error::Project version ${project_version} does not match modinfo version ${{ steps.versions.outputs.mod }}"
          exit 1
        fi

    - name: Check formatting
      run: dotnet format PapermakingPapyrus.slnx --verify-no-changes --no-restore

    - name: Test
      run: dotnet test PapermakingPapyrus.slnx --configuration Release --no-restore

    - name: Verify release tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        expected="v${{ steps.versions.outputs.mod }}"
        if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match modinfo version ${expected}"
          exit 1
        fi

    - name: Package
      run: scripts/package.sh

    - name: Upload package artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: papermakingpapyrus-${{ steps.versions.outputs.mod }}
        path: dist/*.zip
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Read mod version
      id: version
      run: echo "mod=$(jq -er '.version' src/PapermakingPapyrus/modinfo.json)" >> "$GITHUB_OUTPUT"

    - name: Download package artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: papermakingpapyrus-${{ steps.version.outputs.mod }}
        path: dist

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
        else
          gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --verify-tag
        fi
